name: Unpack 10c
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack, check and commit
        run: |
          set -e
          ZIPPATH=$(find . -name 'o4m-record-tests_repo-root-files_2026-11-10c.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIPPATH" ]; then
            echo "::error::The 10c zip is NOT in the repo. Top level files: $(ls -1A | grep -v '^.git$' | tr '\n' ' ') | Any zips anywhere: $(find . -name '*.zip' -not -path './.git/*' | tr '\n' ' ') | Last commit: $(git log -1 --format=%s)"
            exit 1
          fi
          echo "Found zip at $ZIPPATH"
          cp "$ZIPPATH" /tmp/pkg.zip
          git rm -q -f "$ZIPPATH"
          git rm -q -f --ignore-unmatch bundle_2026-11-07b.txt bundle_2026-11-10.txt bundle_2026-11-10b.txt CHANGES_2026-11-10.txt o4m-record-tests-vectors-2026-11-07b.zip SECOND_READER_PACKET/INSTRUCTIONS_FOR_SECOND_READER_2026-11-07.txt SHA256SUMS
          unzip -q -o /tmp/pkg.zip
          test -f SHA256SUMS || { echo "::error::SHA256SUMS missing after unzip (folder inside the zip?)"; exit 1; }
          sha256sum -c SHA256SUMS > /tmp/sums.txt || true
          if grep -qv ': OK$' /tmp/sums.txt; then echo "::error::Checksum mismatch: $(grep -v ': OK$' /tmp/sums.txt | head -n 3 | tr '\n' ' ')"; exit 1; fi
          echo "::notice::All $(grep -c ': OK$' /tmp/sums.txt) files match SHA256SUMS"
          python3 verify.py T3 vectors/T3/t3-003/input.json | grep -E '^Result|T3-GAP|T3-LINK' || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::notice::Nothing to commit"; exit 0; }
          git commit -q -m "Unpacked package tree from 2026-11-10c zip"
          git push
          echo "::notice::Done"
