name: Unpack package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack, check and commit
        run: |
          set -e
          ZIP=$(ls -1 | grep -E '^o4m-record-tests_repo-root-files_.*[.]zip$' | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No zip named o4m-record-tests_repo-root-files_...zip in the repo top level. Files seen: $(ls -1 | head -30 | tr '\n' ' ')"
            exit 1
          fi
          echo "Found zip: $ZIP"
          git rm -q -f --ignore-unmatch bundle_2026-11-07b.txt bundle_2026-11-10.txt bundle_2026-11-10b.txt CHANGES_2026-11-10.txt o4m-record-tests-vectors-2026-11-07b.zip SECOND_READER_PACKET/INSTRUCTIONS_FOR_SECOND_READER_2026-11-07.txt SHA256SUMS
          if ! unzip -q -o "$ZIP"; then
            echo "::error::unzip failed for $ZIP (the upload may be damaged or not a zip)"
            exit 1
          fi
          rm -f "$ZIP"
          if [ ! -f SHA256SUMS ]; then
            echo "::error::SHA256SUMS not found after unzip. The zip may hold a folder instead of files at the top level. Files seen: $(ls -1 | head -30 | tr '\n' ' ')"
            exit 1
          fi
          if ! sha256sum -c SHA256SUMS > /tmp/sums.txt 2>&1; then
            echo "::error::Checksum mismatch or missing file: $(grep -v ': OK$' /tmp/sums.txt | head -5 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::All $(grep -c ': OK$' /tmp/sums.txt) files match SHA256SUMS"
          python3 verify.py T3 vectors/T3/t3-003/input.json | grep -E '^Result|T3-GAP|T3-LINK' || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::Nothing to commit: the repo already matches this package"
            exit 0
          fi
          git commit -m "Unpacked package tree from $ZIP"
          git push
          echo "::notice::Done: package unpacked and committed from $ZIP"
