name: Unpack package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack, check and commit
        run: |
          set -e
          ZIP=$(ls o4m-record-tests_repo-root-files_*.zip | head -n 1)
          test -f "$ZIP"
          git rm -q -f --ignore-unmatch bundle_2026-11-07b.txt bundle_2026-11-10.txt bundle_2026-11-10b.txt CHANGES_2026-11-10.txt o4m-record-tests-vectors-2026-11-07b.zip SECOND_READER_PACKET/INSTRUCTIONS_FOR_SECOND_READER_2026-11-07.txt
          unzip -q -o "$ZIP"
          rm "$ZIP"
          sha256sum -c SHA256SUMS | grep -v ': OK$' || true
          sha256sum -c SHA256SUMS > /dev/null
          python3 verify.py T3 vectors/T3/t3-003/input.json | grep -E '^Result|T3-GAP|T3-LINK' || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpacked package tree from $ZIP"
          git push
